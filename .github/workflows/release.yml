name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag 名（必须是从未被 release 占用过的名字，例如 v1.0.4）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the installable tarball
        run: python scripts/_pack.py

      # 资产名固定为 dsh-math.tgz（不带版本号）：
      # storefront / 市场的 tarball 字段常用 .../releases/latest/download/<name>，
      # 该 URL 只在请求时解析 latest，文件名照字面取 —— 名字里带版本号的话，
      # 提交当天有效，下一次发版就 404。
      - name: Normalize the asset name
        run: |
          set -euo pipefail
          ls -l _dist
          cp _dist/*.tgz dsh-math.tgz
          ls -l dsh-math.tgz
          # 注意：不要用 `grep -q` 或 `head` 直接接在 tar 后面 —— 它们提前退出会让
          # tar 收到 SIGPIPE，配合 pipefail 就把整步判失败。这里让 grep 读完整个流。
          tar -tzf dsh-math.tgz | sed -n '1,5p'
          tar -tzf dsh-math.tgz | grep -x "package/package.json" > /dev/null

      # 这个仓库开启了「不可变 release」（immutable releases）：一旦某个 release
      # 从 draft 变成 published，就再也不能追加或替换资产（API 会返回
      # 422 "Cannot upload assets to an immutable release."），而且 tag 名会被
      # 永久占用，连删掉重建 release 都用不了同一个 tag 名。
      # 因此必须先建 draft → 上传资产 → 最后一步才发布。
      - name: Create a draft release, upload the asset, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release for tag $TAG already exists; immutable releases cannot receive new assets. Push a new tag instead."
            exit 1
          fi
          gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" dsh-math.tgz --clobber
          gh release edit "$TAG" --draft=false
