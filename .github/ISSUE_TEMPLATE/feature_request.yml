name: 功能建议 / Feature request
description: 建议新增算子、工具或改进行为
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！数学能力类请求请尽量给出具体题目与期望结果，便于直接转化为测试用例。
        For math-capability requests, please give a concrete problem and the expected result.

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 例如：「求 ∫x^x dx 时工具返回 unsolved，希望能给出级数展开形式。」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Expected solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
